apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus
  namespace: cerberus
  labels:
    app.kubernetes.io/name: cerberus
spec:
  replicas: 1
  # Never two at once: two could both run the same approved command.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cerberus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cerberus
    spec:
      serviceAccountName: cerberus
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cerberus
          # Pinned by digest, so what runs with cluster-admin rights is one known image.
          # Renovate proposes the new digest after each build.
          image: ghcr.io/sbrerup/cerberus:latest@sha256:58f47822603d70ebae6be06318d445d8df8fd3d30494247e2a3e96e62d22df25
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # The Tailscale logins that may approve or deny. Anyone else gets a refusal.
            - name: APPROVERS
              value: sbrerup@beamray.org
            # The accounts whose requests can be approved at all.
            - name: REQUESTERS
              value: system:serviceaccount:daedalus-access:daedalus
            # Where people open the page. A decision posted from any other address is refused.
            - name: PUBLIC_URL
              value: https://cerberus.turtle-vector.ts.net
            - name: REQUEST_TTL_MINUTES
              value: "30"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TZ
              value: Europe/Copenhagen
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # kubectl keeps a cache in its home folder, which is /tmp here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
